name: Deploy (Cloudflare Workers)

# Publishes the site to Cloudflare Workers on every push to master.
#
# Why Workers rather than Pages or GitHub Pages: the entire premise of this
# site is that any subdomain is a frequency (440.1khz.sh, 60.1khz.sh, …), which
# needs a host that serves the same files for *.1khz.sh.
#   - GitHub Pages does not support wildcard custom domains at all.
#   - Cloudflare Pages does not support wildcard custom domains either.
#   - Cloudflare Worker *routes* do, and Cloudflare's free Universal SSL
#     certificate already covers first-level wildcards like *.1khz.sh.
#
# There is no Worker script here — wrangler.jsonc declares static assets only,
# so this uploads a directory and attaches the two routes. Full setup, DNS
# records included, is in DEPLOYING.md.
#
# ── One-time setup ────────────────────────────────────────────────────────────
#   Add two repository secrets (Settings → Secrets and variables → Actions):
#     CLOUDFLARE_API_TOKEN   — created from the "Edit Cloudflare Workers"
#                              template, scoped to the 1khz.sh zone
#     CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard sidebar
#
# Until those secrets exist this workflow runs but skips the publish step, so a
# fork or a fresh clone never fails.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Are the Cloudflare secrets configured?
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Cloudflare secrets not set — skipping publish."
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action@v3 installs wrangler 3.90.0 unless told otherwise,
          # which predates assets-only Workers and fails with "Missing
          # entry-point" — this project deliberately has no Worker script, just
          # static files. Pin the major version that supports it.
          wranglerVersion: "4"
          command: deploy

      - name: Smoke-test the deployment
        if: steps.gate.outputs.ready == 'true'
        run: |
          # Give the edge a moment to pick up the new version.
          sleep 10
          fail=0
          for url in \
            "https://1khz.sh/" \
            "https://1khz.sh/delay/" \
            "https://1khz.sh/math/" \
            "https://1khz.sh/about/" \
            "https://440.1khz.sh/" ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "ok   $code  $url"
            else
              echo "::error::$url returned $code"
              fail=1
            fi
          done
          # The wildcard check is the one that matters — it proves the route
          # that makes the whole subdomain trick work is still attached.
          exit $fail
